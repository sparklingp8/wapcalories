<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus // Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#0B0E12;
  --panel:#11161D;
  --panel-2:#161D26;
  --line: rgba(255,255,255,.07);
  --line-strong: rgba(255,255,255,.14);
  --amber:#FFB454;
  --amber-dim: rgba(255,180,84,.16);
  --violet:#B79CFF;
  --violet-dim: rgba(183,156,255,.16);
  --cyan:#5CC8FF;
  --cyan-dim: rgba(92,200,255,.14);
  --green:#7FD99A;
  --green-dim: rgba(127,217,154,.14);
  --red:#FF6B6B;
  --text:#E7ECF1;
  --text-dim:#7E8896;
  --text-faint:#4B5563;
  --mono:'JetBrains Mono', monospace;
  --sans:'Inter', system-ui, sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{
  font-family:var(--sans);
  color:var(--text);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(255,180,84,.05), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(92,200,255,.05), transparent 40%);
}

/* subtle scanline texture for the whole app */
body::before{
  content:'';
  position:fixed; inset:0; z-index:50; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px);
  mix-blend-mode:overlay;
}

.app{
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr;
  padding:clamp(10px,1.8vh,18px);
  gap:clamp(8px,1.4vh,14px);
}

/* ---------- Top status strip ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:0 4px;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
}
.brand .dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.brand .name{
  font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.12em;
  color:var(--text); text-transform:uppercase;
}
.brand .sub{
  font-family:var(--mono); font-size:11px; color:var(--text-faint); letter-spacing:.06em;
}
.dateline{
  font-family:var(--mono); font-size:12px; color:var(--text-dim); letter-spacing:.04em;
}

/* ---------- Main grid ---------- */
.grid{
  display:grid;
  grid-template-columns: var(--col1, 0.9fr) var(--col2, 1fr) var(--col3, 1fr);
  grid-template-rows: var(--row1, 0.85fr) var(--row2, 1fr);
  gap:clamp(8px,1.4vh,14px);
  min-height:0;
  position:relative;
}

/* ---------- Resize handles ---------- */
.resize-handle{
  position:absolute;
  z-index:20;
  background:transparent;
  display:flex; align-items:center; justify-content:center;
}
.resize-handle::after{
  content:'';
  background:var(--line-strong);
  border-radius:3px;
  transition:background .15s, opacity .15s;
  opacity:0;
}
.resize-handle:hover::after, .resize-handle.dragging::after{
  background:var(--cyan); opacity:1;
}
.resize-handle.col{
  top:0; bottom:0; width:14px; cursor:col-resize;
}
.resize-handle.col::after{ width:3px; height:40%; }
.resize-handle.row{
  left:0; right:0; height:14px; cursor:row-resize;
}
.resize-handle.row::after{ height:3px; width:40%; }
body.resizing-col, body.resizing-col *{ cursor:col-resize !important; }
body.resizing-row, body.resizing-row *{ cursor:row-resize !important; }
body.resizing-col .card, body.resizing-row .card{ user-select:none; }

.card{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line);
  border-radius:10px;
  padding:clamp(10px,2vh,16px) clamp(12px,1.6vw,18px);
  display:flex; flex-direction:column;
  min-height:0;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, var(--accent, var(--line-strong)), transparent 70%);
}

.card-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:clamp(6px,1.2vh,12px);
  width:100%;
  flex:none;
}
.label{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-dim); font-weight:600;
  display:flex; align-items:center; gap:7px;
}
.label .tick{width:3px;height:12px;background:var(--accent,var(--text-faint));border-radius:1px}
.heading-text{
  outline:none; border-radius:5px; padding:2px 4px; margin:-2px -4px;
  cursor:text;
}
.heading-text:hover{ background:rgba(255,255,255,.05); color:var(--text); }
.heading-text:focus{ background:rgba(255,255,255,.07); box-shadow:0 0 0 1px var(--line-strong); color:var(--text); }

.task-info{
  display:flex; flex-direction:column; gap:3px; margin-bottom:clamp(6px,1vh,10px);
  padding-bottom:clamp(6px,1vh,10px); border-bottom:1px dashed var(--line);
  flex:none;
}
.task-title{
  font-family:var(--sans); font-weight:600; font-size:17px; color:var(--text);
  outline:none; border-radius:6px; padding:2px 4px; margin:-2px -4px; cursor:text;
}
.task-title:hover{background:rgba(255,255,255,.04)}
.task-title:focus{background:rgba(255,255,255,.05); box-shadow:0 0 0 1px var(--line-strong)}
.task-time{
  font-family:var(--mono); font-size:11.5px; color:var(--green); letter-spacing:.03em;
  display:flex; align-items:center; gap:6px;
  outline:none; border-radius:5px; padding:2px 4px; margin:-2px -4px; cursor:text;
}
.task-time::before{content:'▸'; opacity:.7}
.task-time:hover{background:rgba(255,255,255,.04)}
.task-time:focus{background:rgba(255,255,255,.05); box-shadow:0 0 0 1px var(--line-strong)}

.iconbtn{
  width:26px;height:26px; border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  background:transparent; border:1px solid transparent;
  color:var(--text-faint); cursor:pointer; font-size:13px;
  transition:.15s;
}
.iconbtn:hover{background:rgba(255,255,255,.06); border-color:var(--line-strong); color:var(--text)}
.iconbtn:active{transform:scale(.92)}
.head-actions{display:flex; gap:6px}

/* ---------- Middle column stack (Task Countdown / Quote / To-Do — drag-resizable) ---------- */
.col2-stack{
  grid-column:2; grid-row:1/3;
  display:flex; flex-direction:column;
  gap:10px;
  min-height:0;
  position:relative;
}
.col2-stack .task-countdown-card{ flex-grow:var(--mid1, 2); flex-shrink:1; flex-basis:0; min-height:0; }
.col2-stack .quote-card{ flex-grow:var(--mid2, 1); flex-shrink:1; flex-basis:0; min-height:0; }
.col2-stack .todo-card{ flex-grow:var(--mid3, 1); flex-shrink:1; flex-basis:0; min-height:0; }

/* internal drag handles between the three middle-column cards */
.mid-resize-handle{
  position:absolute; left:0; right:0; height:14px;
  cursor:row-resize; z-index:21;
  display:flex; align-items:center; justify-content:center;
  background:transparent;
}
.mid-resize-handle::after{
  content:'';
  background:var(--line-strong);
  border-radius:3px;
  width:40%; height:3px;
  transition:background .15s, opacity .15s;
  opacity:0;
}
.mid-resize-handle:hover::after, .mid-resize-handle.dragging::after{
  background:var(--cyan); opacity:1;
}

/* ---------- To-Do list card (middle column, bottom) ---------- */
.todo-card{ --accent:var(--amber); }
.todo-list{
  flex:1; list-style:none; margin:0; padding:0;
  overflow-y:auto; display:flex; flex-direction:column; gap:6px;
}
.todo-list::-webkit-scrollbar{width:5px}
.todo-list::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.todo-item{
  font-family:var(--mono); font-size:13px; color:var(--text-dim);
  display:flex; align-items:center; gap:9px;
  padding:4px 2px;
  border-bottom:1px dashed var(--line);
}
.todo-item .bul{
  width:15px;height:15px; border-radius:50%; flex:none;
  border:1.5px solid var(--amber); display:flex; align-items:center; justify-content:center;
  color:var(--amber); font-size:9px; font-weight:700;
}
.todo-item .txt{flex:1; color:var(--text)}
.todo-empty{font-family:var(--mono); font-size:11.5px; color:var(--text-faint); padding:6px 2px}


.clock-card{grid-column:1; grid-row:1; --accent:var(--cyan); justify-content:center;}
.clock-wrap{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  overflow-y:auto; min-height:0; padding-right:2px;
}
.clock-wrap::-webkit-scrollbar{width:5px}
.clock-wrap::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.clock-wrap::-webkit-scrollbar-track{background:transparent}
.clock-time{
  font-family:var(--mono); font-weight:800;
  font-size:clamp(28px,5vw,64px);
  color:var(--text);
  letter-spacing:.01em;
  line-height:1;
  text-shadow:0 0 22px rgba(92,200,255,.25);
}
.clock-time .secs{ color:var(--cyan); }
.clock-date{
  font-family:var(--mono); font-size:14px; color:var(--text-dim); letter-spacing:.06em;
}
.clock-meta{
  margin-top:14px; width:100%;
  display:grid; grid-template-columns:1fr; gap:8px;
}
.meta-pill{
  border:1px solid var(--line); border-radius:8px; padding:8px 10px;
  display:flex; flex-direction:column; gap:2px;
}
.meta-pill .k{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase}
.meta-pill .v{font-family:var(--mono);font-size:14px;color:var(--text)}

/* ---------- Timer cards (shared) ---------- */
.timer-card.daily-card{ --accent:var(--amber); }
.timer-card.task-countdown-card{ --accent:var(--violet); }
.timer-display{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(6px,1.4vh,14px);
  overflow-y:auto; min-height:0; padding-right:2px;
}
.timer-display::-webkit-scrollbar{width:5px}
.timer-display::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.timer-display::-webkit-scrollbar-track{background:transparent}
.digits{
  font-family:var(--mono); font-weight:700;
  font-size:clamp(22px,4.5vw,46px);
  letter-spacing:.02em;
  color:var(--accent);
  display:flex; align-items:center; gap:2px;
  text-shadow:0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
  cursor:text;
  border-radius:8px;
  padding:4px 10px;
  transition:background .15s;
}
.digits:hover{background:rgba(255,255,255,.04)}
.digits.editing{background:rgba(255,255,255,.06); box-shadow:0 0 0 1px var(--line-strong)}
.digits input{
  background:transparent; border:none; outline:none;
  font-family:var(--mono); font-weight:700; color:var(--accent);
  font-size:1em; width:2.2ch; text-align:center;
  -moz-appearance:textfield;
}
.digits input::-webkit-outer-spin-button,.digits input::-webkit-inner-spin-button{-webkit-appearance:none}
.colon{opacity:.5; padding:0 1px}

.progress-track{
  width:90%; height:6px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden;
  position:relative;
}
.progress-fill{
  height:100%; border-radius:4px;
  background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, transparent), var(--accent));
  width:0%;
  transition:width .4s linear;
}
.timer-controls{
  display:flex; gap:8px; justify-content:center; margin-top:2px;
}
.ctrl-btn{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--line-strong); background:rgba(255,255,255,.03);
  color:var(--text-dim); padding:7px 12px; border-radius:7px; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transition:.15s;
}
.ctrl-btn:hover{ color:var(--text); border-color:color-mix(in srgb, var(--accent) 50%, var(--line-strong)); background:rgba(255,255,255,.05);}
.ctrl-btn.primary{ color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:700;}
.ctrl-btn.primary:hover{filter:brightness(1.08)}
.ctrl-btn:active{transform:scale(.96)}

.state-flag{
  position:absolute; top:14px; right:18px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  padding:3px 7px; border-radius:5px;
  background:var(--green-dim); color:var(--green); border:1px solid color-mix(in srgb, var(--green) 35%, transparent);
}
.state-flag.paused{background:rgba(255,255,255,.06); color:var(--text-faint); border-color:var(--line-strong)}
.state-flag.over{background:rgba(255,107,107,.14); color:var(--red); border-color:rgba(255,107,107,.35)}

/* ---------- Done list card (Tasks List) — right column ---------- */
.col3-cell{
  grid-column:3; grid-row:1/3;
  position:relative;
  min-height:0;
  display:block;
}
.done-card{
  --accent:var(--cyan);
  position:absolute; top:0; left:0; right:0;
  height:var(--done-h, 70%);
  max-height:100%;
}
.done-resize-handle{
  position:absolute; left:0; right:0; height:14px;
  cursor:row-resize; z-index:21;
  display:flex; align-items:center; justify-content:center;
  background:transparent;
}
.done-resize-handle::after{
  content:'';
  background:var(--line-strong);
  border-radius:3px;
  width:40%; height:3px;
  transition:background .15s, opacity .15s;
  opacity:0;
}
.done-resize-handle:hover::after, .done-resize-handle.dragging::after{
  background:var(--cyan); opacity:1;
}

/* ---------- Quote / raw API feed card ---------- */
.quote-body{
  flex:1; display:flex; align-items:center; justify-content:center;
  overflow-y:auto; min-height:0; padding-right:2px;
}
.quote-body::-webkit-scrollbar{width:5px}
.quote-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.quote-body::-webkit-scrollbar-track{background:transparent}
.quote-raw{
  font-family:var(--mono); font-size:14px; line-height:1.55;
  color:var(--text); white-space:pre-wrap; word-break:break-word;
  text-align:left; width:100%;
  cursor:text; outline:none; border-radius:8px; padding:6px 8px; margin:-6px -8px;
  transition:background .15s;
}
.quote-raw:hover{background:rgba(255,255,255,.04)}
.quote-raw:focus{background:rgba(255,255,255,.05); box-shadow:0 0 0 1px var(--line-strong)}
.quote-meta{
  margin-top:8px; flex:none;
  font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.04em;
  text-align:center;
}

/* ---------- Done list card ---------- */

.done-list{
  flex:1; list-style:none; margin:0; padding:0;
  overflow-y:auto; display:flex; flex-direction:column; gap:7px;
}
.done-list::-webkit-scrollbar{width:5px}
.done-list::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.done-item{
  font-family:var(--mono); font-size:13.5px; color:var(--text-dim);
  display:flex; align-items:center; gap:9px;
  padding:5px 2px;
  border-bottom:1px dashed var(--line);
}
.done-item .ck{
  width:15px;height:15px; border-radius:3px; flex:none;
  border:1.5px solid var(--green); display:flex; align-items:center; justify-content:center;
  color:var(--green); font-size:10px; font-weight:700;
}
.done-item .txt{flex:1; color:var(--text)}
.done-item .hrs-badge{
  font-family:var(--mono); font-size:11px; color:var(--cyan); flex:none;
  border:1px solid color-mix(in srgb, var(--cyan) 40%, transparent);
  background:var(--cyan-dim); border-radius:5px; padding:2px 6px;
  min-width:2.6em; text-align:center;
}
.done-empty{font-family:var(--mono); font-size:12px; color:var(--text-faint); padding:6px 2px}

/* ---------- Total hours footer line (bottom of Tasks List card) ---------- */
.done-total{
  flex:none; margin-top:8px; padding-top:8px;
  border-top:1px dashed var(--line);
  display:flex; align-items:baseline; justify-content:space-between;
  font-family:var(--mono);
}
.done-total .tl{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); }
.done-total time{ font-size:15px; font-weight:700; color:var(--cyan); text-shadow:0 0 12px rgba(92,200,255,.3); }

/* ---------- inline editor for task / done text ---------- */
.raw-edit{
  width:100%; background:rgba(255,255,255,.04); border:1px solid var(--line-strong);
  border-radius:7px; color:var(--text); font-family:var(--sans); font-size:14px;
  padding:8px; resize:none; outline:none;
  align-self:stretch;
}

/* ---------- Card placements ---------- */
.timer-card.daily-card{ grid-column:1; grid-row:2; }
.quote-card{ --accent:var(--green); }

@media (max-width: 880px){
  .grid{grid-template-columns:1fr; grid-template-rows:none; overflow-y:auto;}
  .clock-card,.timer-card,.done-card,.quote-card,.todo-card{grid-column:1; grid-row:auto;}
  .col2-stack{grid-column:1; grid-row:auto; display:contents; position:static;}
  .col2-stack .task-countdown-card,.col2-stack .quote-card,.col2-stack .todo-card{flex:none;}
  .mid-resize-handle{display:none;}
  .col3-cell{grid-column:1; grid-row:auto; display:block; position:static; min-height:auto;}
  .done-card{position:static; height:auto; max-height:none;}
  .done-resize-handle{display:none;}
  .app{overflow-y:auto; height:auto; min-height:100vh;}
  html,body{overflow-y:auto;height:auto}
  .resize-handle{display:none;}
}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span class="name">Focus</span>
      <span class="sub">// session control</span>
    </div>
    <div class="dateline" id="topDate">—</div>
  </div>

  <div class="grid">

    <!-- Clock -->
    <div class="card clock-card">
      <div class="card-head">
        <span class="label heading" data-heading="clock"><span class="tick"></span><span class="heading-text">Current Time</span></span>
      </div>
      <div class="clock-wrap">
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">—</div>
        <div class="clock-meta">
          <div class="meta-pill"><span class="k">Day progress</span><span class="v" id="dayProgress">0%</span></div>
        </div>
      </div>
    </div>

    <!-- Main 10 hour countdown -->
    <div class="card timer-card daily-card" id="dailyCard">
      <span class="state-flag" id="dailyFlag">running</span>
      <div class="card-head">
        <span class="label heading" data-heading="daily"><span class="tick"></span><span class="heading-text">Main 10 Hour Countdown</span></span>
      </div>
      <div class="timer-display">
        <div class="digits" id="dailyDigits" data-target="daily" title="Click to set">10:00:00</div>
        <div class="progress-track"><div class="progress-fill" id="dailyFill"></div></div>
        <div class="timer-controls">
          <button class="ctrl-btn primary" data-action="toggle" data-timer="daily">⏵ start</button>
          <button class="ctrl-btn" data-action="reset" data-timer="daily">↺ reset</button>
        </div>
      </div>
    </div>

    <!-- Middle column stack: Task Countdown / Quote / To-Do — heights drag-resizable -->
    <div class="col2-stack">

      <!-- Current task countdown -->
      <div class="card timer-card task-countdown-card" id="taskCard">
        <span class="state-flag paused" id="taskFlag">paused</span>
        <div class="card-head">
          <span class="label heading" data-heading="task"><span class="tick"></span><span class="heading-text">Current Task Countdown</span></span>
        </div>
        <div class="task-info">
          <div class="task-title" id="taskTitle" contenteditable="true" spellcheck="false">Reading Docker</div>
          <div class="task-time" id="taskTime" contenteditable="true" spellcheck="false">09:30 AM → 10:30 AM</div>
        </div>
        <div class="timer-display">
          <div class="digits" id="taskDigits" data-target="task" title="Click to set">01:00:00</div>
          <div class="progress-track"><div class="progress-fill" id="taskFill"></div></div>
          <div class="timer-controls">
            <button class="iconbtn iconbtn-lg" id="taskClockBtn" title="Set end time">🕐</button>
            <button class="ctrl-btn primary" data-action="toggle" data-timer="task">⏵ start</button>
            <button class="ctrl-btn" data-action="reset" data-timer="task">↺ reset</button>
          </div>
        </div>
        <input type="time" id="taskEndTimeInput" style="position:absolute; opacity:0; pointer-events:none; width:1px; height:1px;">
      </div>

      <div class="mid-resize-handle" id="midHandle1" title="Drag to resize"></div>

      <!-- Quote box (manually updated) -->
      <div class="card quote-card" id="quoteCard">
        <span class="state-flag" id="quoteFlag">fresh</span>
        <div class="card-head">
          <span class="label heading" data-heading="quote"><span class="tick"></span><span class="heading-text">Quote</span></span>
        </div>
        <div class="quote-body" id="quoteBody">
          <div class="quote-raw" id="quoteRaw" contenteditable="true" spellcheck="false">Click here and type your quote.</div>
        </div>
        <div class="quote-meta" id="quoteMeta">updated just now</div>
      </div>

      <div class="mid-resize-handle" id="midHandle2" title="Drag to resize"></div>

      <!-- To-Do list -->
      <div class="card todo-card" id="todoCard">
        <div class="card-head">
          <span class="label heading" data-heading="todo"><span class="tick"></span><span class="heading-text">To-Do</span></span>
          <div class="head-actions">
            <button class="iconbtn" id="todoEditBtn" title="Edit list">✎</button>
            <button class="iconbtn" id="todoAddBtn" title="Add item">+</button>
          </div>
        </div>
        <ul class="todo-list" id="todoList"></ul>
        <textarea class="raw-edit" id="todoRaw" style="display:none" rows="4" placeholder="One item per line"></textarea>
      </div>

    </div>

    <!-- Column 3: Tasks List, height drag-resizable, with total hours logged at the bottom -->
    <div class="col3-cell">
      <div class="card done-card" id="doneCard">
        <div class="card-head">
          <span class="label heading" data-heading="done"><span class="tick"></span><span class="heading-text">Tasks List</span></span>
          <div class="head-actions">
            <button class="iconbtn" id="doneEditBtn" title="Edit list">✎</button>
            <button class="iconbtn" id="doneAddBtn" title="Add item">+</button>
          </div>
        </div>
        <ul class="done-list" id="doneList"></ul>
        <textarea class="raw-edit" id="doneRaw" style="display:none" rows="6" placeholder="One item per line, optionally 'Task, hours' e.g. Docker, 1.5"></textarea>
        <div class="done-total">
          <span class="tl">Total hours learnt</span>
          <time id="totalHours">0h</time>
        </div>
      </div>
      <div class="done-resize-handle" id="doneResizeHandle" title="Drag to resize Tasks List height"></div>
    </div>

    <!-- Resize handles -->
    <div class="resize-handle col" id="handleCol1" title="Drag to resize columns"></div>
    <div class="resize-handle col" id="handleCol2" title="Drag to resize columns"></div>
    <div class="resize-handle row" id="handleRow1" title="Drag to resize rows"></div>

  </div>
</div>

<script>
/* ============== Persistence helpers ============== */
const KEYS = {
  task: 'fd_task_title',
  taskTime: 'fd_task_time',
  done: 'fd_done_items',
  todo: 'fd_todo_items',
};
function lget(k, fallback){ try{ const v = localStorage.getItem(k); return v===null?fallback:v; }catch(e){ return fallback; } }
function lset(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* ============== System clock ============== */
function pad(n){ return String(n).padStart(2,'0'); }

function renderClock(){
  const now = new Date();
  const h = pad(now.getHours()), m = pad(now.getMinutes()), s = pad(now.getSeconds());
  document.getElementById('clockTime').innerHTML = `${h}:${m}<span class="secs">:${s}</span>`;
  document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'});
  document.getElementById('topDate').textContent = now.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}) + '  ·  ' + now.toLocaleTimeString();

  const secsInDay = now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const pct = Math.round((secsInDay/86400)*100);
  document.getElementById('dayProgress').textContent = pct+'%';
}
renderClock();
setInterval(renderClock, 1000);

/* ============== Timer engine ==============
   Each timer has:
   - setSeconds: the duration it was configured to (what "reset" returns to)
   - remaining: current remaining seconds
   - running: bool
   - lastTick: timestamp for drift-free countdown
*/
const timers = {
  daily: { setSeconds: 10*3600, remaining: 10*3600, running:false, lastTick:null },
  task:  { setSeconds: 1*3600,  remaining: 1*3600,  running:false, lastTick:null },
};

function loadTimer(name){
  const s = lget('fd_'+name+'_set', null);
  const r = lget('fd_'+name+'_remaining', null);
  const run = lget('fd_'+name+'_running', null);
  if(s!==null) timers[name].setSeconds = parseInt(s,10);
  if(r!==null) timers[name].remaining = parseInt(r,10);
  if(run!==null) timers[name].running = run==='1';
}
function saveTimer(name){
  const t = timers[name];
  lset('fd_'+name+'_set', String(t.setSeconds));
  lset('fd_'+name+'_remaining', String(t.remaining));
  lset('fd_'+name+'_running', t.running ? '1':'0');
}
loadTimer('daily'); loadTimer('task');

function fmt(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function renderTimer(name){
  const t = timers[name];
  const digitsEl = document.getElementById(name+'Digits');
  const fillEl = document.getElementById(name+'Fill');
  const flagEl = document.getElementById(name+'Flag');
  const toggleBtn = document.querySelector(`.ctrl-btn[data-action="toggle"][data-timer="${name}"]`);

  if(!digitsEl.classList.contains('editing')){
    digitsEl.textContent = fmt(t.remaining);
  }

  const elapsed = Math.max(0, t.setSeconds - t.remaining);
  const pct = t.setSeconds>0 ? Math.min(100, (elapsed/t.setSeconds)*100) : 0;
  fillEl.style.width = pct+'%';

  const card = document.getElementById(name+'Card');
  if(t.remaining<=0){
    flagEl.textContent = 'time up';
    flagEl.className = 'state-flag over';
    fillEl.style.background = 'linear-gradient(90deg, #ff8a8a, var(--red))';
  } else if(t.running){
    flagEl.textContent = 'running';
    flagEl.className = 'state-flag';
    fillEl.style.background = '';
  } else {
    flagEl.textContent = 'paused';
    flagEl.className = 'state-flag paused';
    fillEl.style.background = '';
  }
  if(toggleBtn) toggleBtn.innerHTML = t.running ? '⏸ pause' : '⏵ start';
}

function tickAll(){
  const now = Date.now();
  ['daily','task'].forEach(name=>{
    const t = timers[name];
    if(t.running){
      if(t.lastTick==null) t.lastTick = now;
      const deltaSec = (now - t.lastTick)/1000;
      if(deltaSec >= 1){
        const whole = Math.floor(deltaSec);
        t.remaining = Math.max(0, t.remaining - whole);
        t.lastTick += whole*1000;
        if(t.remaining<=0){ t.running=false; }
        saveTimer(name);
      }
    }
    renderTimer(name);
  });
}
setInterval(tickAll, 250);
renderTimer('daily'); renderTimer('task');

/* ---- controls: start/pause, reset ---- */
document.querySelectorAll('.ctrl-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const name = btn.dataset.timer;
    const action = btn.dataset.action;
    const t = timers[name];
    if(action==='toggle'){
      if(t.remaining<=0){ return; } // nothing to start
      t.running = !t.running;
      t.lastTick = Date.now();
    } else if(action==='reset'){
      t.running = false;
      t.remaining = t.setSeconds;     // "goes back" to the set duration
      t.lastTick = null;
    }
    saveTimer(name);
    renderTimer(name);
  });
});

/* ---- click-to-edit the big digits: type HH:MM:SS, Enter to commit ---- */
function makeDigitsEditable(name){
  const el = document.getElementById(name+'Digits');
  el.addEventListener('click', ()=>{
    if(el.classList.contains('editing')) return;
    el.classList.add('editing');
    const current = fmt(timers[name].remaining);
    el.innerHTML = `<input type="number" min="0" max="99" id="${name}_h" value="${current.slice(0,2)}"><span class="colon">:</span><input type="number" min="0" max="59" id="${name}_m" value="${current.slice(3,5)}"><span class="colon">:</span><input type="number" min="0" max="59" id="${name}_s" value="${current.slice(6,8)}">`;
    const hInp = document.getElementById(name+'_h');
    hInp.focus(); hInp.select();

    function commit(){
      const h = parseInt(document.getElementById(name+'_h').value,10) || 0;
      const m = Math.min(59, parseInt(document.getElementById(name+'_m').value,10) || 0);
      const s = Math.min(59, parseInt(document.getElementById(name+'_s').value,10) || 0);
      const total = Math.max(0, h*3600 + m*60 + s);
      const t = timers[name];
      t.setSeconds = total;   // new duration becomes the "reset" target
      t.remaining = total;
      t.running = false;
      t.lastTick = null;
      saveTimer(name);
      el.classList.remove('editing');
      renderTimer(name);
    }
    function cancel(){
      el.classList.remove('editing');
      renderTimer(name);
    }

    el.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ commit(); }
        if(e.key==='Escape'){ cancel(); }
        if(e.key===':' || e.key==='Tab'){
          // allow natural tabbing between h/m/s; do nothing special
        }
      });
      inp.addEventListener('click', e=>e.stopPropagation());
    });
    // commit when focus leaves all three inputs
    el.addEventListener('focusout', (e)=>{
      setTimeout(()=>{
        if(!el.contains(document.activeElement)){ commit(); }
      }, 0);
    });
  });
}
makeDigitsEditable('daily');
makeDigitsEditable('task');

/* ============== Task countdown: set by target end-time (clock icon) ============== */
(function(){
  const btn = document.getElementById('taskClockBtn');
  const timeInput = document.getElementById('taskEndTimeInput');

  btn.addEventListener('click', ()=>{
    // pre-fill with the current time so the picker opens near "now"
    const now = new Date();
    timeInput.value = pad(now.getHours()) + ':' + pad(now.getMinutes());
    if(timeInput.showPicker){ timeInput.showPicker(); } else { timeInput.focus(); timeInput.click(); }
  });

  timeInput.addEventListener('change', ()=>{
    const val = timeInput.value; // "HH:MM" in 24h, e.g. "16:00"
    if(!val) return;
    const [hh, mm] = val.split(':').map(n=>parseInt(n,10));

    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
    if(target <= now) target.setDate(target.getDate()+1); // target already passed today → assume tomorrow

    const diffSeconds = Math.round((target - now) / 1000);

    const t = timers.task;
    t.setSeconds = diffSeconds;
    t.remaining = diffSeconds;
    t.running = true;          // auto-start as soon as a target time is chosen
    t.lastTick = Date.now();
    saveTimer('task');
    renderTimer('task');

    // reflect the chosen window in the task-time line, e.g. "02:00 PM → 04:00 PM"
    const fmtClock = d => {
      let h = d.getHours(), suffix = h>=12 ? 'PM':'AM';
      h = h % 12; if(h===0) h = 12;
      return pad(h) + ':' + pad(d.getMinutes()) + ' ' + suffix;
    };
    const taskTimeEl = document.getElementById('taskTime');
    const newRange = fmtClock(now) + ' → ' + fmtClock(target);
    taskTimeEl.textContent = newRange;
    lset(KEYS.taskTime, newRange);
  });
})();

/* ============== Editable card headings ============== */
document.querySelectorAll('.heading-text').forEach(el=>{
  const headingEl = el.closest('.heading');
  const key = 'fd_heading_' + headingEl.dataset.heading;
  const saved = lget(key, null);
  if(saved !== null) el.textContent = saved;
  el.setAttribute('contenteditable', 'true');
  el.setAttribute('spellcheck', 'false');

  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); el.blur(); }
    if(e.key==='Escape'){ e.preventDefault(); el.textContent = lget(key, el.textContent); el.blur(); }
  });
  el.addEventListener('blur', ()=>{
    const txt = el.textContent.trim() || 'Untitled';
    el.textContent = txt;
    lset(key, txt);
  });
});

/* ============== Current task editing (always-editable, like headings) ============== */
const taskTitleEl = document.getElementById('taskTitle');
const taskTimeEl = document.getElementById('taskTime');
taskTitleEl.textContent = lget(KEYS.task, 'Reading Docker');
taskTimeEl.textContent = lget(KEYS.taskTime, '09:30 AM → 10:30 AM');

function wireEditableField(el, key, fallback){
  el.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); el.blur(); }
    if(e.key==='Escape'){ e.preventDefault(); el.textContent = lget(key, fallback); el.blur(); }
  });
  el.addEventListener('blur', ()=>{
    const txt = el.textContent.trim() || fallback;
    el.textContent = txt;
    lset(key, txt);
  });
}
wireEditableField(taskTitleEl, KEYS.task, 'Reading Docker');
wireEditableField(taskTimeEl, KEYS.taskTime, '09:30 AM → 10:30 AM');


/* ============== Completed tasks list (with hours logged) ============== */
const defaultDone = [
  {txt:'Bash', hours:1},
  {txt:'Git', hours:1.5},
  {txt:'Docker', hours:2},
];

function normalizeDoneItem(item){
  // migrate legacy plain-string items to {txt, hours} objects
  if(typeof item === 'string') return {txt:item, hours:0};
  return {txt: item.txt || '', hours: (typeof item.hours==='number' && !isNaN(item.hours)) ? item.hours : 0};
}
function getDoneItems(){
  const raw = lget(KEYS.done, null);
  if(raw===null) return defaultDone;
  try{
    const parsed = JSON.parse(raw);
    return parsed.map(normalizeDoneItem);
  }catch(e){ return defaultDone; }
}
function setDoneItems(arr){ lset(KEYS.done, JSON.stringify(arr)); }

function fmtHours(n){
  // trims trailing .0 but keeps one decimal for fractional hours, e.g. 1.5h, 2h
  const r = Math.round(n*100)/100;
  return (r % 1 === 0 ? r.toFixed(0) : r.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')) + 'h';
}

function renderDoneList(){
  const items = getDoneItems();
  const ul = document.getElementById('doneList');
  ul.innerHTML = '';
  if(items.length===0){
    ul.innerHTML = '<div class="done-empty">No completed tasks yet — add one with “+”.</div>';
  } else {
    items.forEach((item)=>{
      const li = document.createElement('li');
      li.className = 'done-item';
      li.innerHTML = `<span class="ck">✓</span><span class="txt"></span><span class="hrs-badge"></span>`;
      li.querySelector('.txt').textContent = item.txt;
      li.querySelector('.hrs-badge').textContent = fmtHours(item.hours);
      ul.appendChild(li);
    });
  }
  renderTotals();
}
renderDoneList();

document.getElementById('doneAddBtn').addEventListener('click', ()=>{
  const txt = prompt('Completed task:');
  if(!txt || !txt.trim()) return;
  const hoursRaw = prompt('Hours spent on this task:', '1');
  const hours = parseFloat(hoursRaw);
  const cur = getDoneItems();
  cur.push({ txt: txt.trim(), hours: isNaN(hours) ? 0 : hours });
  setDoneItems(cur);
  renderDoneList();
});

const doneRaw = document.getElementById('doneRaw');
const doneList = document.getElementById('doneList');
document.getElementById('doneEditBtn').addEventListener('click', ()=>{
  const isRaw = doneRaw.style.display !== 'none';
  if(!isRaw){
    // "Task, hours" per line, e.g. "Docker, 1.5"
    doneRaw.value = getDoneItems().map(it => it.txt + (it.hours ? ', ' + it.hours : '')).join('\n');
    doneList.style.display = 'none';
    doneRaw.style.display = 'block';
    doneRaw.focus();
    document.getElementById('doneEditBtn').textContent = '✓';
  } else {
    const items = doneRaw.value.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
      const idx = line.lastIndexOf(',');
      if(idx === -1) return {txt: line, hours: 0};
      const maybeHours = parseFloat(line.slice(idx+1).trim());
      if(isNaN(maybeHours)) return {txt: line, hours: 0};
      return {txt: line.slice(0, idx).trim(), hours: maybeHours};
    });
    setDoneItems(items);
    doneRaw.style.display = 'none';
    doneList.style.display = 'flex';
    document.getElementById('doneEditBtn').textContent = '✎';
    renderDoneList();
  }
});

/* ============== Total hours footer (bottom of Tasks List) ============== */
function renderTotals(){
  const items = getDoneItems();
  const totalHours = items.reduce((sum, it)=> sum + (it.hours || 0), 0);
  const timeEl = document.getElementById('totalHours');
  timeEl.textContent = fmtHours(totalHours);
  timeEl.setAttribute('datetime', 'PT' + totalHours + 'H');
}

/* ============== To-Do list (middle column) ============== */
const defaultTodo = ['Tier 2 bash problems','Resume polish pass'];
function getTodoItems(){
  const raw = lget(KEYS.todo, null);
  if(raw===null) return defaultTodo;
  try{ return JSON.parse(raw); }catch(e){ return defaultTodo; }
}
function setTodoItems(arr){ lset(KEYS.todo, JSON.stringify(arr)); }

function renderTodoList(){
  const items = getTodoItems();
  const ul = document.getElementById('todoList');
  ul.innerHTML = '';
  if(items.length===0){
    ul.innerHTML = '<div class="todo-empty">No to-dos yet — add one with “+”.</div>';
    return;
  }
  items.forEach((txt)=>{
    const li = document.createElement('li');
    li.className = 'todo-item';
    li.innerHTML = `<span class="bul">▸</span><span class="txt"></span>`;
    li.querySelector('.txt').textContent = txt;
    ul.appendChild(li);
  });
}
renderTodoList();

document.getElementById('todoAddBtn').addEventListener('click', ()=>{
  const txt = prompt('To-do item:');
  if(txt && txt.trim()){
    const cur = getTodoItems();
    cur.push(txt.trim());
    setTodoItems(cur);
    renderTodoList();
  }
});

const todoRaw = document.getElementById('todoRaw');
const todoList = document.getElementById('todoList');
document.getElementById('todoEditBtn').addEventListener('click', ()=>{
  const isRaw = todoRaw.style.display !== 'none';
  if(!isRaw){
    todoRaw.value = getTodoItems().join('\n');
    todoList.style.display = 'none';
    todoRaw.style.display = 'block';
    todoRaw.focus();
    document.getElementById('todoEditBtn').textContent = '✓';
  } else {
    const items = todoRaw.value.split('\n').map(s=>s.trim()).filter(Boolean);
    setTodoItems(items);
    todoRaw.style.display = 'none';
    todoList.style.display = 'flex';
    document.getElementById('todoEditBtn').textContent = '✎';
    renderTodoList();
  }
});

/* ============== Resizable grid sections ============== */
(function(){
  const gridEl = document.querySelector('.grid');
  const MIN_FR = 0.28; // floor so a section never disappears

  function loadGridVars(){
    // set explicit defaults first so getComputedStyle can read custom props even before any drag
    gridEl.style.setProperty('--col1', '0.9fr');
    gridEl.style.setProperty('--col2', '1fr');
    gridEl.style.setProperty('--col3', '1fr');
    gridEl.style.setProperty('--row1', '0.85fr');
    gridEl.style.setProperty('--row2', '1fr');

    const saved = lget('fd_grid_vars', null);
    if(saved){
      try{
        const v = JSON.parse(saved);
        if(v.col1) gridEl.style.setProperty('--col1', v.col1+'fr');
        if(v.col2) gridEl.style.setProperty('--col2', v.col2+'fr');
        if(v.col3) gridEl.style.setProperty('--col3', v.col3+'fr');
        if(v.row1) gridEl.style.setProperty('--row1', v.row1+'fr');
        if(v.row2) gridEl.style.setProperty('--row2', v.row2+'fr');
      }catch(e){}
    }
  }
  function saveGridVars(vals){
    lset('fd_grid_vars', JSON.stringify(vals));
  }
  function getFrVals(){
    const cs = getComputedStyle(gridEl);
    const parseFr = (name, fallback) => {
      const raw = cs.getPropertyValue(name).trim();
      const n = parseFloat(raw);
      return isNaN(n) ? fallback : n;
    };
    return {
      col1: parseFr('--col1', 0.9),
      col2: parseFr('--col2', 1),
      col3: parseFr('--col3', 1),
      row1: parseFr('--row1', 0.85),
      row2: parseFr('--row2', 1),
    };
  }

  function positionHandles(){
    const cols = getComputedStyle(gridEl).gridTemplateColumns.split(' ').map(parseFloat);
    const rows = getComputedStyle(gridEl).gridTemplateRows.split(' ').map(parseFloat);
    const gapPx = parseFloat(getComputedStyle(gridEl).gap) || 14;

    // column boundary 1 (between col1 and col2) — spans full grid height
    const col1Right = cols[0];
    const handleCol1 = document.getElementById('handleCol1');
    handleCol1.style.left = (col1Right + gapPx/2 - 7) + 'px';
    handleCol1.style.width = '14px';

    // column boundary 2 (between col2 and col3) — spans full grid height
    const col2Right = cols[0] + gapPx + cols[1];
    const handleCol2 = document.getElementById('handleCol2');
    handleCol2.style.left = (col2Right + gapPx/2 - 7) + 'px';
    handleCol2.style.width = '14px';

    // row boundary (between row1 and row2) — column 2 now manages its own internal split via col2-stack, so this handle spans only column 1
    const row1Bottom = rows[0];
    const handleRow1 = document.getElementById('handleRow1');
    handleRow1.style.top = (row1Bottom + gapPx/2 - 7) + 'px';
    handleRow1.style.left = '0px';
    handleRow1.style.right = 'auto';
    handleRow1.style.width = col1Right + 'px';
  }

  loadGridVars();
  // position after layout settles
  requestAnimationFrame(positionHandles);
  window.addEventListener('resize', positionHandles);

  function dragColumn(boundaryIndex){ // 1 = between col1/col2, 2 = between col2/col3
    return function(e){
      e.preventDefault();
      document.body.classList.add('resizing-col');
      const handleId = boundaryIndex===1 ? 'handleCol1' : 'handleCol2';
      document.getElementById(handleId).classList.add('dragging');
      const rect = gridEl.getBoundingClientRect();
      const startVals = getFrVals();
      const gapPx = parseFloat(getComputedStyle(gridEl).gap) || 14;
      const usableWidth = rect.width - gapPx*2;
      const totalFr = startVals.col1 + startVals.col2 + startVals.col3;

      function onMove(ev){
        const x = ev.clientX - rect.left;
        let frAtX = (x / usableWidth) * totalFr;

        if(boundaryIndex === 1){
          // moving boundary between col1 and col2; col3 stays fixed
          frAtX = Math.max(MIN_FR, Math.min(totalFr - startVals.col3 - MIN_FR, frAtX));
          const col1 = frAtX;
          const col2 = totalFr - startVals.col3 - frAtX;
          gridEl.style.setProperty('--col1', col1.toFixed(3)+'fr');
          gridEl.style.setProperty('--col2', col2.toFixed(3)+'fr');
        } else {
          // moving boundary between col2 and col3; col1 stays fixed
          const minX = startVals.col1 + MIN_FR;
          const maxX = totalFr - MIN_FR;
          frAtX = Math.max(minX, Math.min(maxX, frAtX));
          const col2 = frAtX - startVals.col1;
          const col3 = totalFr - startVals.col1 - col2;
          gridEl.style.setProperty('--col2', col2.toFixed(3)+'fr');
          gridEl.style.setProperty('--col3', col3.toFixed(3)+'fr');
        }
        positionHandles();
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.body.classList.remove('resizing-col');
        document.getElementById(handleId).classList.remove('dragging');
        const v = getFrVals();
        saveGridVars(v);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
  }

  function dragRow(e){
    e.preventDefault();
    document.body.classList.add('resizing-row');
    document.getElementById('handleRow1').classList.add('dragging');
    const rect = gridEl.getBoundingClientRect();
    const startVals = getFrVals();
    const gapPx = parseFloat(getComputedStyle(gridEl).gap) || 14;
    const usableHeight = rect.height - gapPx;
    const totalFr = startVals.row1 + startVals.row2;

    function onMove(ev){
      const y = ev.clientY - rect.top;
      let frAtY = (y / usableHeight) * totalFr;
      frAtY = Math.max(MIN_FR, Math.min(totalFr - MIN_FR, frAtY));
      const row1 = frAtY, row2 = totalFr - frAtY;
      gridEl.style.setProperty('--row1', row1.toFixed(3)+'fr');
      gridEl.style.setProperty('--row2', row2.toFixed(3)+'fr');
      positionHandles();
    }
    function onUp(){
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('resizing-row');
      document.getElementById('handleRow1').classList.remove('dragging');
      const v = getFrVals();
      saveGridVars(v);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  document.getElementById('handleCol1').addEventListener('mousedown', dragColumn(1));
  document.getElementById('handleCol2').addEventListener('mousedown', dragColumn(2));
  document.getElementById('handleRow1').addEventListener('mousedown', dragRow);

  // touch support
  function toMouseEvent(touchEvent){
    const t = touchEvent.touches[0] || touchEvent.changedTouches[0];
    return { clientX:t.clientX, clientY:t.clientY, preventDefault:()=>touchEvent.preventDefault() };
  }
  document.getElementById('handleCol1').addEventListener('touchstart', e=>dragColumn(1)(toMouseEvent(e)), {passive:false});
  document.getElementById('handleCol2').addEventListener('touchstart', e=>dragColumn(2)(toMouseEvent(e)), {passive:false});
  document.getElementById('handleRow1').addEventListener('touchstart', e=>dragRow(toMouseEvent(e)), {passive:false});
})();

/* ============== Tasks List card: drag-resizable height ============== */
(function(){
  const cell = document.querySelector('.col3-cell');
  const handle = document.getElementById('doneResizeHandle');
  const MIN_PCT = 20;   // never let it collapse to nothing
  const MAX_PCT = 100;  // never push past the bottom of the column

  function applyPct(pct){
    pct = Math.max(MIN_PCT, Math.min(MAX_PCT, pct));
    cell.style.setProperty('--done-h', pct + '%');
    positionDoneHandle(pct);
    return pct;
  }

  function positionDoneHandle(pct){
    handle.style.top = 'calc(' + pct + '% - 7px)';
  }

  function loadDoneHeight(){
    const saved = parseFloat(lget('fd_done_height_pct', '70'));
    const pct = isNaN(saved) ? 70 : saved;
    applyPct(pct);
  }
  loadDoneHeight();
  requestAnimationFrame(()=>positionDoneHandle(parseFloat(getComputedStyle(cell).getPropertyValue('--done-h')) || 70));
  window.addEventListener('resize', ()=>{
    const cur = parseFloat(cell.style.getPropertyValue('--done-h')) || 70;
    positionDoneHandle(cur);
  });

  function dragDoneHeight(getY){
    return function(e){
      e.preventDefault();
      document.body.classList.add('resizing-row');
      handle.classList.add('dragging');
      const rect = cell.getBoundingClientRect();

      function onMove(ev){
        const y = getY(ev) - rect.top;
        const pct = (y / rect.height) * 100;
        applyPct(pct);
      }
      function onUp(){
        document.removeEventListener('mousemove', onMoveMouse);
        document.removeEventListener('mouseup', onUpMouse);
        document.removeEventListener('touchmove', onMoveTouch);
        document.removeEventListener('touchend', onUpTouch);
        document.body.classList.remove('resizing-row');
        handle.classList.remove('dragging');
        const finalPct = parseFloat(cell.style.getPropertyValue('--done-h')) || 70;
        lset('fd_done_height_pct', String(finalPct));
      }
      function onMoveMouse(ev){ onMove(ev); }
      function onUpMouse(){ onUp(); }
      function onMoveTouch(ev){ onMove(ev.touches[0]); }
      function onUpTouch(){ onUp(); }

      document.addEventListener('mousemove', onMoveMouse);
      document.addEventListener('mouseup', onUpMouse);
      document.addEventListener('touchmove', onMoveTouch, {passive:false});
      document.addEventListener('touchend', onUpTouch);
    };
  }

  handle.addEventListener('mousedown', dragDoneHeight(ev=>ev.clientY));
  handle.addEventListener('touchstart', dragDoneHeight(ev=>ev.clientY), {passive:false});
})();

/* ============== Middle column cards: drag-resizable heights (Task Countdown / Quote / To-Do) ============== */
(function(){
  const stack = document.querySelector('.col2-stack');
  const taskCard = document.getElementById('taskCard');
  const quoteCard = document.getElementById('quoteCard');
  const todoCard = document.getElementById('todoCard');
  const handle1 = document.getElementById('midHandle1'); // between task & quote
  const handle2 = document.getElementById('midHandle2'); // between quote & todo
  const MIN_GROW = 0.35; // floor so a section never disappears

  function loadMidVars(){
    stack.style.setProperty('--mid1', '2');
    stack.style.setProperty('--mid2', '1');
    stack.style.setProperty('--mid3', '1');
    const saved = lget('fd_mid_vars', null);
    if(saved){
      try{
        const v = JSON.parse(saved);
        if(v.mid1) stack.style.setProperty('--mid1', v.mid1);
        if(v.mid2) stack.style.setProperty('--mid2', v.mid2);
        if(v.mid3) stack.style.setProperty('--mid3', v.mid3);
      }catch(e){}
    }
  }
  function saveMidVars(vals){ lset('fd_mid_vars', JSON.stringify(vals)); }
  function getMidVals(){
    const cs = getComputedStyle(stack);
    const parseNum = (name, fallback) => {
      const n = parseFloat(cs.getPropertyValue(name).trim());
      return isNaN(n) ? fallback : n;
    };
    return {
      mid1: parseNum('--mid1', 2),
      mid2: parseNum('--mid2', 1),
      mid3: parseNum('--mid3', 1),
    };
  }

  function positionMidHandles(){
    const gapPx = parseFloat(getComputedStyle(stack).gap) || 10;
    const stackRect = stack.getBoundingClientRect();
    const taskRect = taskCard.getBoundingClientRect();
    const quoteRect = quoteCard.getBoundingClientRect();

    const h1Top = (taskRect.bottom - stackRect.top) + gapPx/2 - 7;
    handle1.style.top = h1Top + 'px';

    const h2Top = (quoteRect.bottom - stackRect.top) + gapPx/2 - 7;
    handle2.style.top = h2Top + 'px';
  }

  loadMidVars();
  requestAnimationFrame(positionMidHandles);
  window.addEventListener('resize', positionMidHandles);

  function dragMidBoundary(boundaryIndex){ // 1 = between task/quote, 2 = between quote/todo
    return function(getY){
      return function(e){
        e.preventDefault();
        document.body.classList.add('resizing-row');
        const handleEl = boundaryIndex===1 ? handle1 : handle2;
        handleEl.classList.add('dragging');
        const rect = stack.getBoundingClientRect();
        const startVals = getMidVals();
        const gapPx = parseFloat(getComputedStyle(stack).gap) || 10;
        const usableHeight = rect.height - gapPx*2;
        const totalGrow = startVals.mid1 + startVals.mid2 + startVals.mid3;

        function onMove(ev){
          const y = getY(ev) - rect.top;
          let growAtY = (y / usableHeight) * totalGrow;

          if(boundaryIndex === 1){
            // moving boundary between task & quote; todo stays fixed
            growAtY = Math.max(MIN_GROW, Math.min(totalGrow - startVals.mid3 - MIN_GROW, growAtY));
            const mid1 = growAtY;
            const mid2 = totalGrow - startVals.mid3 - growAtY;
            stack.style.setProperty('--mid1', mid1.toFixed(3));
            stack.style.setProperty('--mid2', mid2.toFixed(3));
          } else {
            // moving boundary between quote & todo; task stays fixed
            const minY = startVals.mid1 + MIN_GROW;
            const maxY = totalGrow - MIN_GROW;
            growAtY = Math.max(minY, Math.min(maxY, growAtY));
            const mid2 = growAtY - startVals.mid1;
            const mid3 = totalGrow - startVals.mid1 - mid2;
            stack.style.setProperty('--mid2', mid2.toFixed(3));
            stack.style.setProperty('--mid3', mid3.toFixed(3));
          }
          positionMidHandles();
        }
        function onUp(){
          document.removeEventListener('mousemove', onMoveMouse);
          document.removeEventListener('mouseup', onUpMouse);
          document.removeEventListener('touchmove', onMoveTouch);
          document.removeEventListener('touchend', onUpTouch);
          document.body.classList.remove('resizing-row');
          handleEl.classList.remove('dragging');
          saveMidVars(getMidVals());
        }
        function onMoveMouse(ev){ onMove(ev); }
        function onUpMouse(){ onUp(); }
        function onMoveTouch(ev){ onMove(ev.touches[0]); }
        function onUpTouch(){ onUp(); }

        document.addEventListener('mousemove', onMoveMouse);
        document.addEventListener('mouseup', onUpMouse);
        document.addEventListener('touchmove', onMoveTouch, {passive:false});
        document.addEventListener('touchend', onUpTouch);
      };
    };
  }

  handle1.addEventListener('mousedown', dragMidBoundary(1)(ev=>ev.clientY));
  handle1.addEventListener('touchstart', dragMidBoundary(1)(ev=>ev.clientY), {passive:false});
  handle2.addEventListener('mousedown', dragMidBoundary(2)(ev=>ev.clientY));
  handle2.addEventListener('touchstart', dragMidBoundary(2)(ev=>ev.clientY), {passive:false});
})();

/* ============== Quote box: manually edited, tracks time since last update ============== */
(function(){
  const UPDATE_INTERVAL_MS = 42 * 60 * 1000; // 42 minutes
  const quoteRawEl = document.getElementById('quoteRaw');
  const quoteFlagEl = document.getElementById('quoteFlag');
  const quoteMetaEl = document.getElementById('quoteMeta');
  const DEFAULT_TEXT = 'Click here and type your quote.';

  // restore last saved quote + when it was last edited
  const savedText = lget('fd_quote_raw', null);
  if(savedText !== null) quoteRawEl.textContent = savedText;
  let lastUpdatedAt = parseInt(lget('fd_quote_updated_at', '0'), 10) || Date.now();
  if(savedText === null) lastUpdatedAt = Date.now();

  function saveQuote(){
    const txt = quoteRawEl.textContent.trim() || DEFAULT_TEXT;
    quoteRawEl.textContent = txt;
    lset('fd_quote_raw', txt);
    lastUpdatedAt = Date.now();
    lset('fd_quote_updated_at', String(lastUpdatedAt));
    renderStatus();
  }

  quoteRawEl.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); quoteRawEl.blur(); }
    if(e.key==='Escape'){ e.preventDefault(); quoteRawEl.textContent = lget('fd_quote_raw', DEFAULT_TEXT); quoteRawEl.blur(); }
  });
  quoteRawEl.addEventListener('blur', saveQuote);

  function fmtAge(ms){
    const totalMin = Math.floor(ms/60000);
    if(totalMin < 1) return 'just now';
    if(totalMin === 1) return '1 min ago';
    if(totalMin < 60) return totalMin + ' min ago';
    const h = Math.floor(totalMin/60), m = totalMin%60;
    return h + 'h ' + m + 'm ago';
  }

  function renderStatus(){
    const age = Date.now() - lastUpdatedAt;
    const minLeft = Math.max(0, Math.ceil((UPDATE_INTERVAL_MS - age)/60000));
    if(age >= UPDATE_INTERVAL_MS){
      quoteFlagEl.textContent = 'update due';
      quoteFlagEl.className = 'state-flag over';
      quoteMetaEl.textContent = 'updated ' + fmtAge(age) + ' — overdue for a new one';
    } else {
      quoteFlagEl.textContent = 'fresh';
      quoteFlagEl.className = 'state-flag';
      quoteMetaEl.textContent = 'updated ' + fmtAge(age) + ' · next change due in ' + minLeft + ' min';
    }
  }

  renderStatus();
  setInterval(renderStatus, 30 * 1000); // recheck twice a minute, cheap and keeps the label fresh
})();
</script>
