<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 0 5vw;
            gap: 2vh;
            color: #fff;
            text-align: center;
            box-sizing: border-box;
        }

        .countdown-container {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            padding: 20px;
            width: 98%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-evenly;
            align-items: center;
        }

        .countdown-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .timer-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 5px;
            position: relative;
        }

        .odometer-card {
            width: 80px;
            height: 70px;
            background-color: #111;
            border: 2px solid #00ffff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .odometer-card-days {
            width: 120px;
            height: 70px;
            background-color: #111;
            border: 2px solid #00ffff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            font-weight: bold;
        }

        .odometer-number {
            font-size: 1.5em;
            color: #00ffff;
            position: absolute;
            transition: transform 0.5s ease-in-out;
            padding: 10px;
        }

        .timer-label {
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            opacity: 0.7;
            font-size: 10px;
        }

        .event-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8), 0 0 30px rgba(0, 255, 255, 0.6);
            flex: 1 0 100%;
            text-align: center;
            margin-bottom: 15px;
            max-width: 800px;
        }

        .times-up {
            display: none;
            color: #ff5e5e;
            font-size: 16px;
            flex: 1 0 100%;
            text-align: center;
        }
       .headingContainer {
            display: flex;
            align-items: center; /* Vertically center the content */
            justify-content: center; /* Horizontally center the text */
            /* Allow the anchor to position relative to the container */
            height: 100px;
            width: 98%;
            max-width: 800px;
        } 
        .headingContainer a {
            position: relative; /* Position the anchor */
            left: 25%; /* Align it to the left edge */
            font-weight: bold;
            color: #00ffff;
            font-size: 1em;
            border-bottom: 1px solid #00ffff;
        }
        .headingContainer a {
            position: relative; /* Position the anchor */
            left: 25%; /* Align it to the left edge */
            font-weight: bold;
            color: #00ffff;
            font-size: 1em;
            border-bottom: 1px solid #00ffff;
        }
        #closeAddCountdown {
            position: relative; /* Position the anchor */
             /* Align it to the left edge */
            left: 46%;
            
            font-size: 1em;
           
        }
        #newCountdown {
            /* width: 80px;
            height: 70px; */
            background-color: #111;
            border: 2px solid #00ffff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 10px;
        }

        /* Media Queries for Enhanced Responsiveness */
        @media screen and (max-width: 600px) {
           
            .headingContainer a {
                position: relative; /* Position the anchor */
                left: 5%; /* Align it to the left edge */
                font-size: 0.8em;
               
            }

            .odometer-number {
                font-size: 1.1em;

            }

            .countdown-container {
                width: 98%;
                padding: 10px;
                gap: 10px;
            }

            .odometer-card {
                width: 60px;
                height: 55px;
            }

            .odometer-card-days {
                width: 70px;
                height: 55px;
            }

            .timer-value {
                font-size: 24px;
            }

            .timer-label {
                font-size: 8px;
                margin-top: 5px;
            }

            .event-title {
                font-size: 16px;
            }
        }

        @media screen and (max-width: 400px) {
            .headingContainer a {
                position: relative; /* Position the anchor */
                left: 5%; /* Align it to the left edge */
                font-size: 0.8em;
               
            }
            .odometer-number {
                font-size: 1.1em;

            }

            .countdown-container {
                width: 98%;
                padding: 10px;
            }

            .odometer-card {
                width: 50px;
                height: 45px;
            }

            .odometer-card-days {
                width: 69px;
                height: 45px;
            }

            .timer-value {
                font-size: 20px;
            }

            .timer-label {
                font-size: 6px;
            }

            .event-title {
                font-size: 14px;
            }
        }

        .hidden {
            display: none;
            /* Hides the element */
        }


       

    
    </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"  crossorigin="anonymous"></script>

</head>

<body>

    <div class="headingContainer">

        <p style="margin-bottom: 0px; color: Red;font-weight: bold;font-size: 26px;text-shadow: 0 0 15px rgba(255, 98, 0, 0.8), 0 0 30px rgba(255, 102, 0, 0.6);">
        Time is RUNNING...!</p> 
        <a id="addEventLink" href="#"><i class='fas fa-hourglass-half' style='font-size:1em'></i><i class='fas fa-plus' style='font-size:1em'></i></a> &nbsp;&nbsp;
        <a id="addUserLink" href="/time/try" style="padding-left: 10px;border-bottom: 0px solid #00ffff;"><i class='fas fa-user-plus' style='font-size:1em'></i></a>

      </div>
    <!-- JSON Data for timers -->
    {% for timer in timers %}
    <div class="countdown-container">
        <div class="event-title" style="position: relative; overflow: hidden;">
            {{ timer.event_name }}
            <span style="position: absolute; right: 0; top: 0; display: inline-block;"> 
                <a id="w" href="{{ userID }}/{{ timer.event_name }}" onclick='return confirm("Delete *{{ timer.event_name }}* count down?");'>
                  <i class='fas fa-times' style='font-size:0.7em;color: red;'></i>
                </a>
              </span>
            </div>
        <div id="countdown-{{ forloop.counter }}" class="countdown-grid">
            <div class="timer-segment">
                <div id="days-{{ forloop.counter }}" class="odometer-card-days">
                    <div class="odometer-number">00</div>
                </div>
                <div class="timer-label">Days</div>
            </div>
            <div class="timer-segment">
                <div id="hours-{{ forloop.counter }}" class="odometer-card">
                    <div class="odometer-number">00</div>
                </div>
                <div class="timer-label">Hours</div>
            </div>
            <div class="timer-segment">
                <div id="minutes-{{ forloop.counter }}" class="odometer-card">
                    <div class="odometer-number">00</div>
                </div>
                <div class="timer-label">Minutes</div>
            </div>
            <div class="timer-segment">
                <div id="seconds-{{ forloop.counter }}" class="odometer-card">
                    <div class="odometer-number">00</div>
                </div>
                <div class="timer-label">Seconds</div>
            </div>
        </div>
        <div id="times-up-{{ forloop.counter }}" class="times-up">
            Time's up for {{ timer.event_name }}!
        </div>
    </div>
    {% endfor %}
    {% include "timeCounter/addNewCountdown.html" %}

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const timers = JSON.parse(document.getElementById('timers-data').textContent);
            const timerIntervals = [];

            function pad(num) {
                return num.toString().padStart(2, '0');
            }

            function createCountdown(config, index) {
                const targetTime = new Date(config.target_time);
                const countdownEl = document.getElementById(`countdown-${index}`);
                const timesUpEl = document.getElementById(`times-up-${index}`);
                const daysEl = document.getElementById(`days-${index}`);
                const hoursEl = document.getElementById(`hours-${index}`);
                const minutesEl = document.getElementById(`minutes-${index}`);
                const secondsEl = document.getElementById(`seconds-${index}`);

                function updateTimer() {
                    const now = new Date();
                    const difference = targetTime - now;

                    if (difference > 0) {
                        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                        const minutes = Math.floor((difference / (1000 * 60)) % 60);
                        const seconds = Math.floor((difference / 1000) % 60);

                        updateOdometerCard(daysEl, pad(days));
                        updateOdometerCard(hoursEl, pad(hours));
                        updateOdometerCard(minutesEl, pad(minutes));
                        updateOdometerCard(secondsEl, pad(seconds));
                    } else {
                        clearInterval(timerIntervals[index - 1]);
                        countdownEl.style.display = "none";
                        timesUpEl.style.display = "block";
                    }
                }

                updateTimer();
                return setInterval(updateTimer, 1000);
            }

            function updateOdometerCard(cardElement, newValue) {
                if (!cardElement) return;
                const numberElement = cardElement.querySelector('.odometer-number');
                const currentValue = numberElement.textContent;

                if (currentValue !== newValue) {
                    // Create a new number element to animate
                    const newNumberElement = document.createElement('div');
                    newNumberElement.className = 'odometer-number';
                    newNumberElement.textContent = newValue;

                    // Position the new number above the current one
                    newNumberElement.style.transform = 'translateY(-100%)';

                    // Add the new number to the card
                    cardElement.appendChild(newNumberElement);

                    // Trigger reflow to ensure transition works
                    void newNumberElement.offsetWidth;

                    // Animate both old and new numbers
                    numberElement.style.transform = 'translateY(100%)';
                    newNumberElement.style.transform = 'translateY(0)';

                    // Remove the old number after animation
                    setTimeout(() => {
                        cardElement.removeChild(numberElement);
                    }, 500);
                }
            }

            timers.forEach((timer, index) => {
                timerIntervals.push(createCountdown(timer, index + 1));
            });
        });
        
    </script>
    
</body>

</html>
