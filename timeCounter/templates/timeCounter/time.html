<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timers</title>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

body {
    font-family: 'Orbitron', sans-serif;
    background-color: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: #fff;
    text-align: center;
    padding: 30px;
    gap: 20px;
    
}

.countdown-container {
    background-color: rgba(0,0,0,0.7);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    padding: 20px;
    width: 98%; /* Responsive width */
    max-width: 800px;
    
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: space-evenly;
    align-items: center;
}

.countdown-grid {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap; /* Allow wrapping on smaller screens */
}

.timer-segment {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 5px;
}

.timer-card {
    width: 80px; /* Reduced width for better responsiveness */
    height: 70px;
    background-color: #111;
    border: 2px solid #00ffff;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}
.timer-card-days {
    width: 100px; /* Reduced width for better responsiveness */
    height: 70px;
    background-color: #111;
    border: 2px solid #00ffff;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    font-weight: bold;
}
.timer-value {
    font-size: 30px; /* Slightly smaller font */
    color: #00ffff;
    position: absolute;
    transition: transform 1s ease;
}

.timer-label {
    color: #00ffff;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 8px;
    opacity: 0.7;
    font-size: 10px;
}

.event-title {
    color: #ffffff;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(0, 255, 255, 0.8), 0 0 30px rgba(0, 255, 255, 0.6);
    flex: 1 0 100%;
    text-align: center;
    margin-bottom: 15px;
}

.times-up {
    display: none;
    color: #ff5e5e;
    font-size: 16px;
    flex: 1 0 100%;
    text-align: center;
}

/* Media Queries for Enhanced Responsiveness */
@media screen and (max-width: 600px) {
    .countdown-container {
        width: 98%;
        padding: 10px;
        gap: 10px;
    }

    .timer-card {
        width: 60px;
        height: 55px;
    }
    .timer-card-days {
        width: 70px;
        height: 55px;
    }

    .timer-value {
        font-size: 24px;
    }

    .timer-label {
        font-size: 8px;
        margin-top: 5px;
    }

    .event-title {
        font-size: 16px;
    }
}

@media screen and (max-width: 400px) {
    .countdown-container {
        width: 98%;
        padding: 10px;
    }

    .timer-card {
        width: 50px;
        height: 45px;
    }
     .timer-card-days {
        width: 69px;
        height: 45px;
    }

    .timer-value {
        font-size: 20px;
    }

    .timer-label {
        font-size: 6px;
    }

    .event-title {
        font-size: 14px;
    }
}
    </style>
</head>

<body>
    <!-- JSON Data for timers -->
    <script id="timers-data" type="application/json">{{ timers_json | safe }}</script>

    {% for timer in timers %}
    <div class="countdown-container">
        <div class="event-title">{{ timer.event_name }}</div>
        <div id="countdown-{{ forloop.counter }}" class="countdown-grid">
            <div class="timer-segment">
                <div id="days-{{ forloop.counter }}" class="timer-card-days">
                    <div class="timer-value">00</div>
                </div>
                <div class="timer-label">Days</div>
            </div>
            <div class="timer-segment">
                <div id="hours-{{ forloop.counter }}" class="timer-card">
                    <div class="timer-value">00</div>
                </div>
                <div class="timer-label">Hours</div>
            </div>
            <div class="timer-segment">
                <div id="minutes-{{ forloop.counter }}" class="timer-card">
                    <div class="timer-value">00</div>
                </div>
                <div class="timer-label">Minutes</div>
            </div>
            <div class="timer-segment">
                <div id="seconds-{{ forloop.counter }}" class="timer-card">
                    <div class="timer-value">00</div>
                </div>
                <div class="timer-label">Seconds</div>
            </div>
        </div>
        <div id="times-up-{{ forloop.counter }}" class="times-up">
            Time's up for {{ timer.event_name }}!
        </div>
    </div>
    {% endfor %}

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const timers = JSON.parse(document.getElementById('timers-data').textContent);
            const timerIntervals = [];

            function pad(num) {
                return num.toString().padStart(2, '0');
            }

            function createCountdown(config, index) {
                const targetTime = new Date(config.target_time);
                const countdownEl = document.getElementById(`countdown-${index}`);
                const timesUpEl = document.getElementById(`times-up-${index}`);
                const daysEl = document.getElementById(`days-${index}`);
                const hoursEl = document.getElementById(`hours-${index}`);
                const minutesEl = document.getElementById(`minutes-${index}`);
                const secondsEl = document.getElementById(`seconds-${index}`);

                function updateTimer() {
                    const now = new Date();
                    const difference = targetTime - now;

                    if (difference > 0) {
                        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                        const minutes = Math.floor((difference / (1000 * 60)) % 60);
                        const seconds = Math.floor((difference / 1000) % 60);

                        updateValue(daysEl, pad(days));
                        updateValue(hoursEl, pad(hours));
                        updateValue(minutesEl, pad(minutes));
                        updateValue(secondsEl, pad(seconds));
                    } else {
                        clearInterval(timerIntervals[index - 1]);
                        countdownEl.style.display = "none";
                        timesUpEl.style.display = "block";
                    }
                }

                updateTimer();
                return setInterval(updateTimer, 1000);
            }

            function updateValue(element, newValue) {
                if (!element) return;
                const currentValue = element.querySelector('.timer-value').textContent;
                if (currentValue !== newValue) {
                    const currentEl = element.querySelector('.timer-value');
                    const newEl = document.createElement('div');
                    newEl.className = 'timer-value';
                    newEl.textContent = newValue;

                    element.appendChild(newEl);

                    currentEl.style.transform = 'translateY(100%)';
                    newEl.style.transform = 'translateY(0)';

                    setTimeout(() => element.removeChild(currentEl), 500);
                }
            }

            timers.forEach((timer, index) => {
                timerIntervals.push(createCountdown(timer, index + 1));
            });
        });
    </script>

</body>

</html>
