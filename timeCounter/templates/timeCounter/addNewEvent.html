<script id="timers-data" type="application/json">{{ timers_json | safe }}</script>
<!-- JSON Data for timers -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<div class="max-w-md mx-auto  p-6 rounded-lg shadow-md">
    <button id="addEventBtn" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
        Add New Event
    </button>
    <div id="poo">
        <form id="eventForm" class="hidden mt-4" method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label for="eventName" class="block text-white-700 mb-2">Event Name</label>
                <input type="text" id="eventName" name="event_name" class="w-full text-black px-3 py-2 border rounded-lg" placeholder="Enter event name">

            </div>

            <div class="mb-4">
                <label for="eventDateTime" class="block text-white-700 mb-2">Event Date and Time</label>
                <input type="datetime-local" id="eventDateTime" name="target_time"
                    class="w-full text-black px-3 py-2 border rounded-lg">
            </div>

            <button type="submit" id="saveEventBtn"
                class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600">
                Save Event
            </button>
        </form>
    </div>
</div>

<script>
    // Ensure form is hidden on page load (though already set with 'hidden' class)
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('eventForm').classList.add('hidden');
        console.log("hi")
    });

    document.getElementById('addEventBtn').addEventListener('click', function () {
        document.getElementById('eventForm').classList.remove('hidden');
        this.classList.add('hidden');
    });

    document.getElementById('eventForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const eventName = document.getElementById('eventName').value;
        const eventDateTime = document.getElementById('eventDateTime').value;

        fetch('/time/age', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({
                event_name: eventName,
                target_time: eventDateTime
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('eventForm').classList.add('hidden');
                    document.getElementById('addEventBtn').classList.remove('hidden');
                    document.getElementById('eventName').value = '';
                    document.getElementById('eventDateTime').value = '';
                }
            });
    });
</script>
