<script id="timers-data" type="application/json">{{ timers_json | safe }}</script>
<!-- JSON Data for timers -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<div>

    <div id="newCountdown">
        <button id="addEventBtn" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
            style=" background-color: #0afefeb6;
                border: 2px solid #111;padding: 5px;font-weight: bold;color: white;text-shadow: 0 0 15px white, 0 0 30px white;">
            Add New Countdown
        </button>
        <form id="eventForm" class="hidden mt-4" method="post" action="/time/addCountdown/{{userID}}">
            {% csrf_token %}
            <div class="mb-4">

                <a id="closeAddCountdown" href="#"><i class='fas fa-times' style='font-size:1.5em;color: red;'></i></a>

                <label for="eventName" class="block text--700-bold mb-2" style="font-weight:bold">New Countdown
                    Name</label>
                <input type="text" id="eventName" name="event_name" maxlength="25"
                    class="w-full text-black px-3 py-2 border rounded-lg" placeholder="Enter event name" required>

            </div>

            <div class="mb-4">
                <label for="eventDateTime" class="block text-white-700 mb-2"
                    style="font-weight: bold;color: white;">Countdown Date and Time</label>
                <input type="datetime-local" id="eventDateTime" name="target_time"
                    class="w-full text-black px-3 py-2 border rounded-lg" required maxlength="100">
            </div>
            <div class="mb-4">
                <label for="userPin" class="block text-white-700 mb-2"
                    style="font-weight: bold;color: white;">Secret PIN</label>
                <input type="password" id="userPIN" name="user_pin"
                    class="w-full text-black px-3 py-2 border rounded-lg" required maxlength="100">
            </div>

            <button type="submit" id="saveEventBtn" class="w-full  py-2 rounded "
                style=" background-color: #0afefeb6; border: 2px solid #111;padding: 5px;font-weight: bold;color: white;text-shadow: 0 0 15px white, 0 0 30px white;">
                Save New Countdown
            </button>
        </form>
    </div>
</div>

<script>
    // Ensure form is hidden on page load (though already set with 'hidden' class)
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('eventForm').classList.add('hidden');
        window.scrollTo({
            top: 0, // Scroll to the top of the page
            behavior: 'smooth' // Optional: Adds smooth scrolling animation
        });
    });

    document.getElementById('addEventBtn').addEventListener('click', function () {
        document.getElementById('eventForm').classList.remove('hidden');
        this.classList.add('hidden');
        window.scrollTo({
            top: document.body.scrollHeight, // Scroll to the bottom of the page
            behavior: 'smooth' // Optional: Adds smooth scrolling animation
        });
    });

    
</script>
